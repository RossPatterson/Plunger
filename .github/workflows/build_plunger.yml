name: Build Plunger

on: [push]

jobs:

#**************************************************#
  update_cms:
    name: Update CMS
    runs-on: [ubuntu-24.04]
    container: rosspatterson/vm370:builder
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout: cms_update

      - name: Start Hercules
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /opt/hercules/vm370/dasd_shadows /opt/hercules/vm370/io
          cp hercules.conf /opt/hercules/vm370
          chmod -R ugo+rw /opt/hercules/vm370/*
          . /usr/local/hercules/setup.sh
          cd /opt/hercules/vm370
          hercules -f /opt/hercules/vm370/hercules.conf -d >/dev/null 2>/dev/null &

      - name: Update CMS
        shell: bash
        run: |
          set -euo pipefail
          chmod +x cms_update/*.rexx
          echo "Running update_cms.rexx"
          rexx ./cms_update/update_cms.rexx

      - name: Prepare DASD files
        shell: bash
        run: |
          set -euo pipefail
          herccontrol "quit"
          sleep 30 # Hercules has a built-in delay after "quit" :-(

      - name: Collect DASD files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/build_work/dasd_shadows
          cp /opt/hercules/vm370/dasd_shadows/* ~/build_work/dasd_shadows
          chmod -R ugo+r ~/build_work/dasd_shadows
  
      - name: Upload DASD changes
        uses: actions/upload-artifact@v7
        with:
          name: DASD
          path: ~/build_work/dasd_shadows
          retention-days: 2   # We don't need them after the workflow ends.

#**************************************************#
  build:
    name: Build Plunger
    needs: [update_cms]
    runs-on: [ubuntu-24.04]
    container: rosspatterson/vm370:builder
    outputs:
      BUILD_DATE:     ${{ steps.build.outputs.BUILD_DATE     }}
      BUILD_TIME:     ${{ steps.build.outputs.BUILD_TIME     }}
      VERSION_STRING: ${{ steps.build.outputs.VERSION_STRING }}
    steps:
      - name: Get DASD changes
        uses: actions/download-artifact@v8
        with:
          name: DASD
          path: ~/build_work/download

      - name: Update DASD
        shell: bash
        run: |
          set -euo pipefail
          cd ~/build_work/download
          mkdir -p /opt/hercules/vm370/dasd_shadows /opt/hercules/vm370/io
          mv *.shadow /opt/hercules/vm370/dasd_shadows

      - name: Checkout source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Move source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/build_work/repo
          mv * ~/build_work/repo

      - name: Start Hercules
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /opt/hercules/vm370/io
          cp ~/build_work/repo/hercules.conf /opt/hercules/vm370
          chmod -R ugo+rw /opt/hercules/vm370/*
          . /usr/local/hercules/setup.sh
          cd /opt/hercules/vm370
          hercules -f /opt/hercules/vm370/hercules.conf -d >/dev/null 2>/dev/null &

      - name: Build
        id: build
        shell: bash
        run: |
          set -euo pipefail
          cd ~/build_work/repo
          chmod +x build.sh mkdoc.sh fixdoc/fixdoc.py
          echo "Running build.sh"
          ./build.sh

      - name: Get package files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/build_work/upload
          mv /opt/hercules/vm370/io/plunger.vmarc ~/build_work/upload
          cp ~/build_work/repo/plunger.memo ~/build_work/upload
          chmod -R ugo+r ~/build_work/upload

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: Plunger
          path: ~/build_work/upload
          retention-days: 2   # We don't need them after the workflow ends.

#**************************************************#
  test:
    name: Test Plunger
    needs: [update_cms, build]
    runs-on: [ubuntu-24.04]
    container: rosspatterson/vm370:builder
    steps:
      - name: Get DASD changes
        uses: actions/download-artifact@v8
        with:
          name: DASD
          path: ~/build_work/download

      - name: Update DASD
        shell: bash
        run: |
          set -euo pipefail
          cd ~/build_work/download
          mkdir -p /opt/hercules/vm370/dasd_shadows /opt/hercules/vm370/io
          mv *.shadow /opt/hercules/vm370/dasd_shadows

      - name: Checkout source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout: |
            cms_update/upload_file.rexx
            test.sh

      - name: Move Source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/build_work/repo ~/build_work/download
          mv * ~/build_work/repo
          ls -l ~/build_work/repo ~/build_work/repo/cms_update

      - name: Get package
        uses: actions/download-artifact@v8
        with:
          name: Plunger
          path: ~/build_work/downloads

      - name: Start Hercules
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /opt/hercules/vm370/io
          cp ~/build_work/repo/hercules.conf /opt/hercules/vm370
          chmod -R ugo+rw /opt/hercules/vm370/*
          . /usr/local/hercules/setup.sh
          cd /opt/hercules/vm370
          hercules -f /opt/hercules/vm370/hercules.conf -d >/dev/null 2>/dev/null &

      - name: Test
        working-directory: /opt/hercules/vm370
        env:
          BUILD_DATE: ${{needs.build.outputs.BUILD_DATE}}
          BUILD_TIME: ${{needs.build.outputs.BUILD_TIME}}
          VERSION_STRING: ${{needs.build.outputs.VERSION_STRING}}
        shell: bash
        run: |
          set -euo pipefail
          cd ~/build_work/repo
          chmod +x test.sh
          echo "Running test.sh"
          ./test.sh "$VERSION_STRING" "$BUILD_DATE" "$BUILD_TIME"

#**************************************************#
  release:
    if: startsWith(github.ref, 'refs/tags/')
    name: Release
    needs: [update_cms, build, test]
    runs-on: [ubuntu-24.04]
    permissions:
      packages: write
      contents: write
    steps:
      - name: Get package
        uses: actions/download-artifact@v8
        with:
          name: Plunger

      - name: ZIP package
        run:
          zip Plunger.zip plunger.memo plunger.vmarc

      - name: Create release
        id: create_release
        uses: actions/create-release@v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          draft: true
          prerelease: true

      - name: Upload release asset
        id: upload-release-asset
        uses: actions/upload-release-asset@v1.0.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: Plunger.zip
          asset_name: Plunger.zip
          asset_content_type: application/zip
